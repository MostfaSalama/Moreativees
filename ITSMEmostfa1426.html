<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#050505">
<title>MOREATIVE</title>
<link rel="icon" href="/assets/logo-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/studio-ui/app.css">
</head>
<body>
<!-- 3D background canvas -->
<canvas id="bg3d" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;opacity:.55;pointer-events:none"></canvas>

<div id="welcome" style="position:fixed;inset:0;z-index:70;background:#050505;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-family:'Archivo Black',Space Grotesk,sans-serif;letter-spacing:.22em;opacity:1;visibility:visible;transition:opacity .8s ease;pointer-events:auto">
  <div style="font-size:clamp(2.4rem,7vw,5.5rem);line-height:1.05;text-align:center;animation:welcomeFade .8s ease both">
    <span style="display:block;font-size:.55em;color:rgba(255,255,255,.55);letter-spacing:.35em;margin-bottom:.35em">MOREATIVE</span>
    <span style="display:block;letter-spacing:.08em">WELCOME WOLF</span>
  </div>
  <div style="width:140px;height:2px;background:rgba(255,255,255,.25);margin:1.4rem 0;border-radius:999px;animation:welcomeLine .8s .25s ease both"></div>
  <div style="font-family:Inter,system-ui,sans-serif;font-size:.82rem;color:rgba(255,255,255,.45);letter-spacing:.3em;text-transform:uppercase;animation:welcomeSub .8s .45s ease both">Enter the studio</div>
</div>
<style>
@keyframes welcomeFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes welcomeLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes welcomeSub{from{opacity:0}to{opacity:1}}
</style>
<script>
(function(){
  document.getElementById('loginBtn').addEventListener('click',function(e){
    e.preventDefault();
    var w=document.getElementById('welcome');
    if(w){w.style.opacity='0';w.style.pointerEvents='none';}
    setTimeout(function(){document.getElementById('gate').hidden=false;},700);
  },{once:true});
})();
</script>
<div id="gate">
  <div class="gatebox">
    <div class="mark" style="font-family:'Archivo Black',Space Grotesk,sans-serif;letter-spacing:.3em;font-size:1.15rem;margin-bottom:1.2rem;position:relative;display:inline-block">
  <svg width="42" height="42" viewBox="0 0 42 42" style="vertical-align:-9px;margin-right:.35rem;filter:drop-shadow(0 0 10px rgba(255,255,255,.25))" aria-label="Moreative">
    <defs><linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#ccc"/></linearGradient></defs>
    <circle cx="21" cy="21" r="19" fill="none" stroke="url(#iconGrad)" stroke-width="1.5"/>
    <path d="M13 28 L21 10 L29 28 Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="21" cy="23" r="2.8" fill="#fff"/>
  </svg>
  <span>MOREATIVE <span>/ STUDIO</span></span>
</div>
    <p class="hint" id="gateHint">Enter the password to edit and publish the site.</p>

    <label class="sr" for="pw">Password</label>
    <div style="position:relative">
      <input id="pw" type="password" name="password" placeholder="Password" autocomplete="current-password" spellcheck="false" style="padding-right:3rem">
      <button type="button" id="togglePw" style="position:absolute;right:.4rem;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;cursor:pointer;font-size:1.1rem;line-height:1;padding:.25rem" aria-label="Show password" title="Show password">&#128065;</button>
    </div>
    <button id="loginBtn" class="btn primary" type="button" style="width:100%">Sign in</button>
    <div class="err" id="gateErr" role="alert"></div>

    <div class="setup" hidden>
      This page stays locked until it has a password.<br>
      Vercel → Settings → Environment Variables → add
      <code>STUDIO_PASSWORD</code> and <code>GITHUB_TOKEN</code>, then Redeploy.
    </div>
  </div>
</div>

<!-- ---------------------------------------------------------------- app -->
<div id="app" hidden>
  <header id="bar">
    <div class="mark" style="font-family:'Archivo Black',Space Grotesk,sans-serif;letter-spacing:.3em;font-size:1.15rem;margin-bottom:1.2rem;position:relative;display:inline-block">
  <svg width="42" height="42" viewBox="0 0 42 42" style="vertical-align:-9px;margin-right:.35rem;filter:drop-shadow(0 0 10px rgba(255,255,255,.25))" aria-label="Moreative">
    <defs><linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#ccc"/></linearGradient></defs>
    <circle cx="21" cy="21" r="19" fill="none" stroke="url(#iconGrad)" stroke-width="1.5"/>
    <path d="M13 28 L21 10 L29 28 Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="21" cy="23" r="2.8" fill="#fff"/>
  </svg>
  <span>MOREATIVE <span>/ STUDIO</span></span>
</div>
    <nav class="tabs">
      <button type="button" data-tab="projects">Projects</button>
      <button type="button" data-tab="content">Content</button>
      <button type="button" data-tab="sections">Sections</button>
      <button type="button" data-tab="publish">Publish</button>
    </nav>
    <div class="sp"></div>
    <div class="state" id="state"><i></i><span>Live</span></div>
    <button id="previewBtn" class="btn" type="button">View site</button>
    <button id="publishTop" class="btn primary" type="button">Publish</button>
    <button id="outBtn" class="btn" type="button">Sign out</button>
  </header>

  <main>
    <section class="tab" id="tab-projects"></section>
    <section class="tab" id="tab-content"></section>
    <section class="tab" id="tab-sections"></section>
    <section class="tab" id="tab-publish"></section>
  </main>
</div>

<!-- ---------------------------------------------------------------- sheet -->
<div id="sheet" role="dialog" aria-modal="true" aria-label="Edit project">
  <div class="sheetbox" id="sheetBox"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/assets/studio-ui/app.js"></script>
</body>
</html>
