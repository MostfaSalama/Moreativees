<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#050505">
<title>MOREATIVE</title>
<link rel="icon" href="/assets/logo-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/studio-ui/app.css">
</head>
<body>
<!-- 3D background canvas -->
<canvas id="bg3d" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;opacity:.55;pointer-events:none"></canvas>

<!-- ---------------------------------------------------------------- gate -->
<div id="gate">
  <div class="gatebox">
    <div class="mark">MOREATIVE <span>/ STUDIO</span></div>
    <p class="hint" id="gateHint">Enter the password to edit and publish the site.</p>

    <label class="sr" for="pw">Password</label>
    <div style="position:relative">
      <input id="pw" type="password" name="password" placeholder="Password" autocomplete="current-password" spellcheck="false" style="padding-right:3rem">
      <button type="button" id="togglePw" style="position:absolute;right:.4rem;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;cursor:pointer;font-size:1.1rem;line-height:1;padding:.25rem" aria-label="Show password" title="Show password">&#128065;</button>
    </div>
    <button id="loginBtn" class="btn primary" type="button" style="width:100%">Sign in</button>
    <div class="err" id="gateErr" role="alert"></div>

    <div class="setup" hidden>
      This page stays locked until it has a password.<br>
      Vercel → Settings → Environment Variables → add
      <code>STUDIO_PASSWORD</code> and <code>GITHUB_TOKEN</code>, then Redeploy.
    </div>
  </div>
</div>

<!-- ---------------------------------------------------------------- app -->
<div id="app" hidden>
  <header id="bar">
    <div class="mark">MOREATIVE <span>/ STUDIO</span></div>
    <nav class="tabs">
      <button type="button" data-tab="projects">Projects</button>
      <button type="button" data-tab="content">Content</button>
      <button type="button" data-tab="sections">Sections</button>
      <button type="button" data-tab="publish">Publish</button>
    </nav>
    <div class="sp"></div>
    <div class="state" id="state"><i></i><span>Live</span></div>
    <button id="previewBtn" class="btn" type="button">View site</button>
    <button id="publishTop" class="btn primary" type="button">Publish</button>
    <button id="outBtn" class="btn" type="button">Sign out</button>
  </header>

  <main>
    <section class="tab" id="tab-projects"></section>
    <section class="tab" id="tab-content"></section>
    <section class="tab" id="tab-sections"></section>
    <section class="tab" id="tab-publish"></section>
  </main>
</div>

<!-- ---------------------------------------------------------------- sheet -->
<div id="sheet" role="dialog" aria-modal="true" aria-label="Edit project">
  <div class="sheetbox" id="sheetBox"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/assets/studio-ui/app.js"></script>
<script>
(function(){
  var c=document.getElementById('bg3d'),ctx=c.getContext('2d');
  if(!c||!ctx)return;
  var W=c.width=window.innerWidth,H=c.height=window.innerHeight;
  var pts=[]; for(var i=0;i<60;i++){ pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6}); }
  function loop(){
    ctx.fillStyle='#050505'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1;
    for(var i=0;i<pts.length;i++){
      var p=pts[i]; p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,1.5,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fill();
      for(var j=i+1;j<pts.length;j++){ var q=pts[j]; var dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy); if(d<160){ ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke(); } }
    }
    requestAnimationFrame(loop);
  }
  window.addEventListener('resize',function(){ W=c.width=window.innerWidth; H=c.height=window.innerHeight; });
  loop();
})();
</script>
</body>
</html>
