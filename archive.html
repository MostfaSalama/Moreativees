<style>
:root{--bg:#050505;--ink:#f5f5f5;--line:rgba(255,255,255,.15)}
body{background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;overflow-x:hidden}
.font-display{font-family:'Space Grotesk',sans-serif}
.font-black-x{font-family:'Archivo Black',sans-serif}
.nav-logo{height:30px;width:auto;display:block}
.pill{background:#f5f5f5;color:#000;border-radius:999px;font-weight:600}
#arch-head{text-align:center;padding:8.5rem 1.5rem 2rem}
.pfglass{display:flex;justify-content:center;gap:.4rem;margin:0 auto;animation:pgFloat 6s ease-in-out 2s infinite}
@keyframes pgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pfglass .pg{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.3);border-top-color:rgba(255,255,255,.6);border-radius:.9rem;padding:.45em .4em;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 18px 40px rgba(0,0,0,.45);opacity:0;transform:translateY(44px) scale(.9);animation:pgIn .65s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:var(--d,0s);transition:transform .35s ease,box-shadow .35s,border-color .35s;cursor:default}
@keyframes pgIn{from{opacity:0;transform:translateY(44px) scale(.9)}to{opacity:1;transform:none}}
.pfglass.in .pg{opacity:1}
.pfglass.done .pg{opacity:1;transform:none}
.pfglass .pg span{font-family:'Archivo Black',sans-serif;font-size:clamp(1.4rem,5.5vw,3.2rem);line-height:1;color:rgba(255,255,255,.94);text-shadow:0 1px 0 rgba(255,255,255,.3),0 0 22px rgba(255,255,255,.18)}
.pfglass .pg::after{content:'';position:absolute;top:-20%;bottom:-20%;left:-90%;width:55%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);transition:left .7s ease}
.pfglass .pg:hover{transform:translateY(-9px);border-color:rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 24px 50px rgba(0,0,0,.5),0 0 30px rgba(255,255,255,.18)}
.pfglass .pg:hover::after{left:140%}
#filters{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center;padding:0 1.2rem 2.4rem}
.fpill{background:transparent;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:.6rem 1.3rem;font-family:'Space Grotesk',sans-serif;font-size:.72rem;letter-spacing:.18em;cursor:pointer;transition:.3s}
.fpill:hover{border-color:#fff;color:#fff}
.fpill.on{background:#f5f5f5;color:#000;border-color:#f5f5f5;font-weight:700}
#arch-count{text-align:center;font-size:.7rem;letter-spacing:.3em;color:rgba(255,255,255,.45);padding-bottom:1.4rem}
.works-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;transition:opacity .35s}
.works-grid.fade{opacity:0}
.work-card{position:relative;overflow:hidden;cursor:pointer;background:#0c0c0c}
.work-card.wide{grid-column:span 7;aspect-ratio:16/10}
.work-card.std{grid-column:span 5;aspect-ratio:8/7}
.work-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);transition:filter .6s,transform .9s cubic-bezier(.2,.8,.25,1);display:block}
.work-card:hover img{filter:none;transform:scale(1.05)}
.wc-index{position:absolute;top:1rem;left:1.2rem;z-index:2;font-size:.62rem;letter-spacing:.28em;color:rgba(255,255,255,.8);pointer-events:none}
.wc-cat{position:absolute;top:1rem;right:1.2rem;z-index:2;font-size:.6rem;letter-spacing:.22em;color:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:.3rem .8rem;pointer-events:none;backdrop-filter:blur(8px)}
.wc-grad{position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.85));opacity:0;transition:opacity .5s;pointer-events:none}
.work-card:hover .wc-grad{opacity:1}
.wc-name{position:absolute;left:0;right:0;bottom:0;padding:1.2rem 1.4rem;transform:translateY(14px);opacity:0;transition:opacity .5s,transform .5s;pointer-events:none}
.work-card:hover .wc-name{opacity:1;transform:none}
.wc-name b{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.2rem,2.6vw,1.9rem);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
@media(hover:none){.wc-grad,.wc-name{opacity:1;transform:none}}
@media(max-width:768px){.wc-index{top:.6rem;left:.8rem;font-size:.55rem}.wc-cat{top:.6rem;right:.8rem;font-size:.52rem}.wc-name{padding:.8rem .9rem}.wc-name b{font-size:.95rem}}
#behance-view{position:fixed;inset:0;z-index:95;background:#080808;display:none;overflow-y:auto;overscroll-behavior:contain}
#behance-view.open{display:block}
.behance-head{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 1.25rem;background:rgba(5,5,5,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}
.b-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.1rem;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);font-size:.8rem;letter-spacing:.12em;cursor:pointer;color:#fff;transition:.25s}
.b-btn:hover{background:#f5f5f5;color:#000}
.b-btn.solid{background:#f5f5f5;color:#000;border-color:#f5f5f5;font-weight:700}
.b-count{font-size:.75rem;letter-spacing:.25em;color:rgba(255,255,255,.5)}
.behance-frame{width:min(1920px,96vw);margin:0 auto;padding:2.5rem 0 4rem}
.behance-kicker{font-size:.7rem;letter-spacing:.35em;color:rgba(255,255,255,.55)}
.behance-title{font-family:'Archivo Black',sans-serif;font-size:clamp(2rem,6vw,4.5rem);line-height:.95;margin:.8rem 0}
.behance-desc{color:rgba(255,255,255,.72);font-size:clamp(.95rem,1.6vw,1.15rem);line-height:1.7;max-width:900px}
.behance-meta{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.4rem 0 2rem}
.behance-meta span,.behance-meta a{font-size:.72rem;letter-spacing:.14em;padding:.5rem .95rem;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:rgba(255,255,255,.85)}
.behance-meta a{background:#f5f5f5;color:#000;border-color:#f5f5f5;font-weight:700;text-decoration:none}
.behance-hero{overflow:hidden;border-radius:1.2rem;border:1px solid rgba(255,255,255,.12)}
.behance-hero img,.behance-item img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#111}
.behance-item{margin-top:1.4rem;overflow:hidden;border-radius:1.2rem;border:1px solid rgba(255,255,255,.1);background:#0c0c0c}
.behance-nav{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:2.5rem}
.behance-nav button{position:relative;height:140px;border-radius:1.2rem;overflow:hidden;border:1px solid rgba(255,255,255,.14);cursor:pointer;background:#111;color:#fff;text-align:left}
.behance-nav button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.behance-nav button span{position:relative;z-index:1;display:block;padding:1.1rem;font-weight:700;letter-spacing:.12em}
.behance-nav button small{position:relative;z-index:1;display:block;padding:0 1.1rem;font-size:.7rem;letter-spacing:.25em;color:rgba(255,255,255,.7)}
@media(max-width:640px){.behance-nav{grid-template-columns:1fr}}
footer{border-top:1px solid rgba(255,255,255,.1);margin-top:4rem;padding:2rem;text-align:center;color:rgba(255,255,255,.5);font-size:.85rem}
#wa-float{position:fixed;right:22px;bottom:22px;z-index:80;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.55));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:waFloat 3s ease-in-out infinite;transition:box-shadow .35s}
#wa-float:hover{box-shadow:0 0 34px rgba(255,255,255,.6),0 10px 30px rgba(0,0,0,.5)}
@keyframes waFloat{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
#wa-float svg{width:28px;height:28px;fill:#111}
#wa-float .wa-dot{position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:50%;background:#25D366;box-shadow:0 0 10px rgba(37,211,102,.95),0 0 22px rgba(37,211,102,.55);animation:waDot 1.8s ease-in-out infinite}
@keyframes waDot{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@media(max-width:768px){#wa-float{width:52px;height:52px;right:16px;bottom:16px}#wa-float svg{width:25px;height:25px}}
</style>
</head>

<script>
(function(){
var PROJECTS=[],CATS=['Logo','Branding Identity','Packaging','3D Modeling','Prints','Production'];
var curCat='All';
function normProject(p,i){
  var fall=['PROJECT '+(i+1)];
  var seed=String((p&&p.name)||('pr'+i)).toLowerCase().replace(/[^a-z0-9]+/g,'');
  var gal=Array.isArray(p&&p.gallery)?p.gallery.slice():[];
  if(!gal.length){
    var base=(p&&p.image)||('https://picsum.photos/seed/'+seed+'/1280/800');
    gal=[base,'https://picsum.photos/seed/'+seed+'-a/1920/1080','https://picsum.photos/seed/'+seed+'-b/1920/1080'];
  }
  return {
    id:(p&&p.id)||seed||('p'+i), t:(p&&p.name)||fall[0], d:(p&&p.desc)||'',
    img:(p&&p.image)||gal[0], gallery:gal, client:(p&&p.client)||'Moreative Client',
    year:(p&&p.year)||'2026', role:(p&&p.role)||'', services:(p&&p.services)||[],
    links:(p&&p.links)||[], cat:(p&&p.cat)||'Branding Identity',
    keywords:(p&&Array.isArray(p.keywords))?p.keywords:[]
  };
}
function load(){
  return fetch('data/site.json?v='+Date.now()).then(function(r){return r.json();}).then(function(data){
    PROJECTS=(data.projects||[]).map(normProject).filter(function(p){return (data.projects.find(function(x){return (x.id||'')===(p.id);})||{}).status!=='draft';});
    renderFilters(); renderGrid();
    try{
      var old=document.getElementById('seo-schema'); if(old) old.remove();
      var sc=document.createElement('script'); sc.type='application/ld+json'; sc.id='seo-schema';
      sc.textContent=JSON.stringify({ '@context':'https://schema.org', '@type':'ItemList', name:'Moreative — Full Archive',
        itemListElement:PROJECTS.map(function(p,i){ return {'@type':'ListItem',position:i+1,item:{'@type':'CreativeWork',name:p.t,description:String(p.d||'').slice(0,300),image:p.img,keywords:((p.keywords||[]).concat(p.services||[]).concat([p.cat||''])).filter(Boolean).join(', ')}}; }) });
      document.head.appendChild(sc);
    }catch(e){}
  }).catch(function(){});
}
(function(){
  var t=document.getElementById('pfglass'); if(!t) return;
  var chips=[];
  var word=(t.textContent||'PORTFOLIO').trim()||'PORTFOLIO'; t.innerHTML=''; t.setAttribute('aria-label',word);
  word.split('').forEach(function(ch,i){
    var c=document.createElement('span'); c.className='pg'; c.style.setProperty('--d',(i*0.07)+'s');
    var s=document.createElement('span'); s.textContent=ch; c.appendChild(s); t.appendChild(c); chips.push(c);
  });
  t.classList.add('in');
  setTimeout(function(){
    t.classList.add('done');
    chips.forEach(function(c){ c.style.animation='none'; });
  }, 9*70+800);
})();
function renderFilters(){
  var f=document.getElementById('filters'); f.innerHTML='';
  ['All'].concat(CATS).forEach(function(c){
    var b=document.createElement('button');
    b.className='fpill'+(curCat===c?' on':'');
    b.textContent=c.toUpperCase();
    b.onclick=function(){ if(curCat===c)return; curCat=c; renderFilters(); renderGrid(true); };
    f.appendChild(b);
  });
}
function visible(){
  return PROJECTS.map(function(p,i){return {p:p,i:i};}).filter(function(o){ return curCat==='All'||o.p.cat===curCat; });
}
function renderGrid(anim){
  var g=document.getElementById('works-grid');
  function draw(){
    g.innerHTML='';
    var list=visible();
    document.getElementById('arch-count').textContent=list.length+' PROJECT'+(list.length===1?'':'S')+(curCat==='All'?'':' — '+curCat.toUpperCase());
    list.forEach(function(o,k){
      var pat=k%4, a=document.createElement('article');
      a.className='work-card '+((pat===0||pat===3)?'wide':'std');
      a.innerHTML='<img loading="lazy" alt=""><span class="wc-cat"></span><span class="wc-grad"></span><span class="wc-name"><b></b></span>';
      var img=a.querySelector('img'); img.src=o.p.img; img.alt=o.p.t;
      img.onerror=function(){this.onerror=null;this.src='https://picsum.photos/seed/arch'+o.i+'/1280/800';};
      a.querySelector('b').textContent=o.p.t;
      a.querySelector('.wc-cat').textContent=o.p.cat.toUpperCase();
      a.onclick=function(){ openBehance(o.i); };
      g.appendChild(a);
    });
    g.classList.remove('fade');
  }
  if(anim){ g.classList.add('fade'); setTimeout(draw,220); } else draw();
}
var __bIndex=0;
function getGallery(p){ return (p.gallery&&p.gallery.length)?p.gallery:[p.img]; }
function openBehance(i){
  __bIndex=(i+PROJECTS.length)%PROJECTS.length;
  renderBehance();
  var v=document.getElementById('behance-view');
  v.classList.add('open'); v.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden'; v.scrollTop=0;
}
function renderBehance(){
  var p=PROJECTS[__bIndex]; if(!p) return;
  document.getElementById('b-title').textContent=p.t;
  document.getElementById('b-desc').textContent=p.d;
  document.getElementById('b-kicker').textContent=p.client.toUpperCase()+' • '+p.year;
  var meta=document.getElementById('b-meta'); meta.innerHTML='';
  [p.client,p.year,p.role,p.cat].concat(p.services||[]).filter(Boolean).forEach(function(s){
    var sEl=document.createElement('span'); sEl.textContent=s; meta.appendChild(sEl);
  });
  (p.links||[]).forEach(function(L){
    if(!L||!L.url) return;
    var aEl=document.createElement('a'); aEl.href=L.url; aEl.target='_blank'; aEl.rel='noopener';
    aEl.textContent='↗ '+(L.label||'Link'); meta.appendChild(aEl);
  });
  (p.keywords||[]).forEach(function(k){
    if(!k) return;
    var kEl=document.createElement('span'); kEl.textContent='#'+String(k).toLowerCase();
    kEl.style.cssText='border-style:dashed;opacity:.85';
    meta.appendChild(kEl);
  });
  var hero=document.getElementById('b-hero');
  hero.src=p.img; hero.alt=p.t+' — cover';
  hero.onerror=function(){this.onerror=null;this.src='https://picsum.photos/seed/'+__bIndex+'arch/1920/1080';};
  var g=document.getElementById('b-gallery'); g.innerHTML='';
  getGallery(p).forEach(function(src,k){
    if(k===0 && src===p.img) return;
    var fig=document.createElement('figure'); fig.className='behance-item';
    var im=document.createElement('img'); im.loading='lazy'; im.src=src; im.alt=p.t+' — shot '+(k+1);
    im.onerror=function(){this.onerror=null;this.src='https://picsum.photos/seed/arch'+__bIndex+'x'+k+'/1920/1080';};
    fig.appendChild(im); g.appendChild(fig);
  });
  var pv=PROJECTS[(__bIndex-1+PROJECTS.length)%PROJECTS.length];
  var nx=PROJECTS[(__bIndex+1)%PROJECTS.length];
  document.getElementById('b-prev-t').textContent='← '+pv.t;
  document.getElementById('b-next-t').textContent=nx.t+' →';
  document.getElementById('b-prev-img').src=pv.img;
  document.getElementById('b-next-img').src=nx.img;
}
function stepBehance(d){ openBehance(__bIndex+d); }
function closeBehance(){ var v=document.getElementById('behance-view'); v.classList.remove('open'); v.setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
window.openBehance=openBehance; window.closeBehance=closeBehance; window.stepBehance=stepBehance;
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeBehance();
  if(!document.getElementById('behance-view').classList.contains('open')) return;
  if(e.key==='ArrowRight') stepBehance(1);
  if(e.key==='ArrowLeft') stepBehance(-1);
});
load();
})();
</script>
<script>
if (location.search.indexOf('studio=1') > -1) {
  var __es = document.createElement('script');
  __es.src = 'studio-bridge.js?v=' + Date.now();
  document.body.appendChild(__es);
}
</script>
