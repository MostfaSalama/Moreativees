.pfglass .pg{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.3);border-top-color:rgba(255,255,255,.6);border-radius:.9rem;padding:.45em .4em;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 18px 40px rgba(0,0,0,.45);opacity:0;transform:translateY(44px) scale(.9);animation:pgIn .65s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:var(--d,0s);transition:transform .35s ease,box-shadow .35s,border-color .35s;cursor:default}
@keyframes pgIn{from{opacity:0;transform:translateY(44px) scale(.9)}to{opacity:1;transform:none}}
.pfglass.in .pg{opacity:1}

.pfglass .pg:hover{transform:translateY(-9px);border-color:rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 24px 50px rgba(0,0,0,.5),0 0 30px rgba(255,255,255,.18)}

.fpill .fc::before{content:'/';margin-right:.18em;opacity:.55}
.fpill::after{content:'';position:absolute;left:.95rem;right:.95rem;bottom:.58rem;height:1px;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .55s cubic-bezier(.2,.8,.25,1)}
.fpill:hover{color:rgba(255,255,255,.92)}
.fpill:hover .fn{color:rgba(255,255,255,.62)}
.fpill.on{color:#fff}
.fpill.on .fn{color:#fff}
.fpill.on .fc{color:rgba(255,255,255,.55)}

@media(max-width:640px){#filters{margin-bottom:2rem;padding:0 .85rem;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 32px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 32px),transparent 100%)}.fpill{padding:.9rem .7rem 1.05rem;font-size:.64rem;letter-spacing:.16em}.fpill::after{left:.7rem;right:.7rem;bottom:.5rem}}

.wc-index{display:inline-flex;align-items:center;gap:.55rem;font-family:'Space Grotesk',sans-serif;font-style:normal;font-size:.58rem;letter-spacing:.3em;color:rgba(255,255,255,.78);font-variant-numeric:tabular-nums;text-shadow:0 1px 12px rgba(0,0,0,.6)}

.wc-grad{position:absolute;inset:0;z-index:2;background:linear-gradient(to top,rgba(0,0,0,.94) 0%,rgba(0,0,0,.56) 30%,rgba(0,0,0,0) 64%);opacity:0;transition:opacity .55s ease;pointer-events:none}
.wc-name{position:absolute;left:0;right:0;bottom:0;z-index:4;display:block;padding:1.15rem 1.3rem 1.25rem;transform:translateY(18px);opacity:0;transition:opacity .55s ease,transform .6s cubic-bezier(.2,.8,.25,1);pointer-events:none}
.wc-rule{display:block;height:1px;margin-bottom:.72rem;background:linear-gradient(90deg,rgba(255,255,255,.8),rgba(255,255,255,.04));transform:scaleX(0);transform-origin:left;transition:transform .7s cubic-bezier(.2,.8,.25,1) .08s}

.work-card.has-swap .wc-swap{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .4s ease;-webkit-mask-image:radial-gradient(circle var(--lr,150px) at var(--mx,50%) var(--my,50%),#000 0 40%,rgba(0,0,0,.94) 58%,rgba(0,0,0,.55) 78%,rgba(0,0,0,0) 100%);mask-image:radial-gradient(circle var(--lr,150px) at var(--mx,50%) var(--my,50%),#000 0 40%,rgba(0,0,0,.94) 58%,rgba(0,0,0,.55) 78%,rgba(0,0,0,0) 100%)}
.work-card.has-swap .wc-swap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:none;transform:none}
.work-card.has-swap.is-lens .wc-swap{opacity:1}
.work-card.has-swap.show-alt .wc-swap{opacity:1;-webkit-mask-image:none;mask-image:none}
.wc-swapring{position:absolute;left:var(--mx,50%);top:var(--my,50%);z-index:3;width:calc(var(--lr,150px) * 1.36);height:calc(var(--lr,150px) * 1.36);transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.42);box-shadow:0 0 30px rgba(0,0,0,.25) inset,0 12px 44px rgba(0,0,0,.32);opacity:0;transition:opacity .3s ease;pointer-events:none}
.work-card.has-swap.is-lens .wc-swapring{opacity:.6}
.wc-swapbtn{position:absolute;right:.9rem;bottom:.85rem;z-index:5;display:inline-flex;align-items:center;gap:.36rem;padding:.46rem .68rem .44rem;border-radius:999px;border:1px solid rgba(255,255,255,.34);background:rgba(10,10,10,.34);-webkit-backdrop-filter:blur(12px) saturate(1.15);backdrop-filter:blur(12px) saturate(1.15);box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.22);color:rgba(255,255,255,.92);font-family:'Space Grotesk',sans-serif;font-size:.49rem;font-weight:600;letter-spacing:.18em;line-height:1;text-transform:uppercase;cursor:pointer;transition:background .3s ease,color .3s ease,border-color .3s ease}

.wc-swapbtn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.62)}
.work-card.show-alt .wc-swapbtn{background:#f5f5f5;color:#050505;border-color:#f5f5f5}
.work-card.has-swap .wc-arrow{display:none}
.work-card.has-swap .wc-row{padding-right:82px}
.work-card.is-reveal img{filter:none;transform:scale(1.045)}
.work-card.is-reveal .wc-top,.work-card.is-reveal .wc-name{opacity:1;transform:none}
.work-card.is-reveal .wc-grad{opacity:1}
.work-card.is-reveal .wc-rule{transform:scaleX(1)}
.work-card.is-reveal .wc-arrow{opacity:1;transform:none}

  .work-card.has-swap .wc-row{padding-right:0}

/* ---- clean routes: /portfolio , /portfolio/<category> , /portfolio/<category>/<project> ---- */
var BASE='/portfolio';
function slugify(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function urlFor(cat,proj){
  if(proj) return BASE+'/'+slugify(proj.cat||'work')+'/'+slugify(proj.id||proj.t);
  if(cat&&cat!=='All') return BASE+'/'+slugify(cat);
  return BASE;
}
function setPath(url,mode){
  try{ if(mode==='replace') history.replaceState({pf:1},'',url); else history.pushState({pf:1},'',url); }catch(e){}
}
function parsePath(){
  var parts=location.pathname.replace(/\/+$/,'').split('/').filter(Boolean);
  if(!parts.length) return {cat:null,proj:null,valid:false};
  if(parts[0]!=='portfolio') return {cat:null,proj:null,valid:false};
  return {cat:parts[1]?decodeURIComponent(parts[1]):null,proj:parts[2]?decodeURIComponent(parts[2]):null,valid:true};
}
function paintPath(){
  var el=document.getElementById('pf-path'); if(!el) return;
  var v=document.getElementById('behance-view');
  var open=!!(v&&v.classList.contains('open')&&PROJECTS[__bIndex]);
  var p=open?PROJECTS[__bIndex]:null;
  var bits=['PORTFOLIO'];
  if(p) bits.push(String(p.cat||'').toUpperCase(),String(p.t||'').toUpperCase());
  else if(curCat&&curCat!=='All') bits.push(String(curCat).toUpperCase());
  el.innerHTML='';
  bits.filter(Boolean).forEach(function(b,i){
    if(i){ var sp=document.createElement('span'); sp.className='sep'; sp.textContent='/'; el.appendChild(sp); }
    var t=document.createElement(i===bits.length-1?'b':'span'); t.textContent=b; el.appendChild(t);
  });
  if(p) document.title=String(p.t).toUpperCase()+' — Portfolio | MOREATIVE';
  else if(curCat&&curCat!=='All') document.title=String(curCat).toUpperCase()+' — Portfolio | MOREATIVE';
  else document.title='Portfolio — MOREATIVE Creative Studio';
}
function syncFromUrl(initial){
  var r=parsePath();
  if(!r.valid){ setPath(BASE,'replace'); }
  var cat='All';
  // a shared project link should show the full grid behind it, not a filtered one
  var skipCat=(initial===true&&r.proj);
  if(r.cat&&!skipCat){ for(var i=0;i<CATS.length;i++){ if(slugify(CATS[i])===r.cat){ cat=CATS[i]; break; } } }
  if(cat!==curCat){ curCat=cat; renderFilters(); renderGrid(true); }
  var idx=-1;
  if(r.proj){ for(var j=0;j<PROJECTS.length;j++){ if(slugify(PROJECTS[j].id||PROJECTS[j].t)===r.proj){ idx=j; break; } } }
  if(idx>-1){ openBehance(idx,'none'); }
  else{
    var v=document.getElementById('behance-view');
    if(v&&v.classList.contains('open')) closeBehance('none');
    paintPath();
    if(r.proj){ setPath(urlFor(curCat),'replace'); }
  }
}
window.addEventListener('popstate',function(){ syncFromUrl(false); });
function absUrl(u){
  if(!u) return u;
  var s=String(u);
  if(/^(https?:)?\/\//i.test(s) || s.indexOf('data:')===0) return s;
  return '/'+s.replace(/^\.?\//,'');
}
function normProject(p,i){
  var fall=['PROJECT '+(i+1)];
  var seed=String((p&&p.name)||('pr'+i)).toLowerCase().replace(/[^a-z0-9]+/g,'');
  var gal=Array.isArray(p&&p.gallery)?p.gallery.slice():[];
  if(!gal.length){
    var base=(p&&p.image)||('https://picsum.photos/seed/'+seed+'/1280/800');
    gal=[base,'https://picsum.photos/seed/'+seed+'-a/1920/1080','https://picsum.photos/seed/'+seed+'-b/1920/1080'];
  }
  gal=gal.map(function(g){ if(g&&typeof g==='object') g=g.image||g.url||g.src||''; return absUrl(g); }).filter(Boolean);
  return {
    id:(p&&p.id)||seed||('p'+i), t:(p&&p.name)||fall[0], d:(p&&p.desc)||'',
    img:absUrl((p&&p.image)||gal[0]), gallery:gal, client:(p&&p.client)||'Moreative Client',
    year:(p&&p.year)||'2026', role:(p&&p.role)||'', services:(p&&p.services)||[],
    links:(p&&p.links)||[], cat:(p&&p.cat)||'Branding Identity',
    alt:absUrl((p&&(p.altImage||p.alt||p.after))||''),
    keywords:(p&&Array.isArray(p.keywords))?p.keywords:[]
  };
}
function load(){
  return fetch('/data/site.json?v='+Date.now()).then(function(r){return r.json();}).then(function(data){
    PROJECTS=(data.projects||[]).map(normProject).filter(function(p){return (data.projects.find(function(x){return (x.id||'')===(p.id);})||{}).status!=='draft';});
    renderFilters(); renderGrid();
    try{
      var old=document.getElementById('seo-schema'); if(old) old.remove();
      var sc=document.createElement('script'); sc.type='application/ld+json'; sc.id='seo-schema';
      sc.textContent=JSON.stringify({ '@context':'https://schema.org', '@type':'ItemList', name:'Moreative — Full Archive',
        itemListElement:PROJECTS.map(function(p,i){ return {'@type':'ListItem',position:i+1,item:{'@type':'CreativeWork',name:p.t,description:String(p.d||'').slice(0,300),image:p.img,keywords:((p.keywords||[]).concat(p.services||[]).concat([p.cat||''])).filter(Boolean).join(', ')}}; }) });
      document.head.appendChild(sc);
    }catch(e){}
  }).catch(function(){});
}
(function(){
  var t=document.getElementById('pfglass'); if(!t) return;
  var chips=[];
  var word=(t.textContent||'PORTFOLIO').trim()||'PORTFOLIO'; t.innerHTML=''; t.setAttribute('aria-label',word);
  word.split('').forEach(function(ch,i){
    var c=document.createElement('span'); c.className='pg'; c.style.setProperty('--d',(i*0.07)+'s');
    var s=document.createElement('span'); s.textContent=ch; c.appendChild(s); t.appendChild(c); chips.push(c);
  });
  t.classList.add('in');
  setTimeout(function(){
    t.classList.add('done');
    chips.forEach(function(c){ c.style.animation='none'; });
  }, 9*70+800);
})();
function pad2(n){ return (n<10?'0':'')+n; }
function catCount(c){ return c==='All'?PROJECTS.length:PROJECTS.filter(function(p){return p.cat===c;}).length; }
function renderFilters(){
  var f=document.getElementById('filters'); if(!f) return; f.innerHTML='';
  ['All'].concat(CATS).forEach(function(c,n){
    var b=document.createElement('button');
    b.type='button';
    b.className='fpill'+(curCat===c?' on':'');
    b.setAttribute('aria-pressed',curCat===c?'true':'false');
    b.setAttribute('aria-label',c+', '+catCount(c)+' project'+(catCount(c)===1?'':'s'));
    b.innerHTML='<i class="fn">'+pad2(n+1)+'</i><span class="fl">'+c.toUpperCase()+'</span><i class="fc">'+pad2(catCount(c))+'</i>';
    b.onclick=function(){ if(curCat===c)return; clearReveal(); curCat=c; renderFilters(); renderGrid(true); setPath(urlFor(curCat)); paintPath(); };
    f.appendChild(b);
  });
  var act=f.querySelector('.fpill.on');
  if(act){ try{ var r=act.getBoundingClientRect(), fr=f.getBoundingClientRect(); if(r.left<fr.left||r.right>fr.right){ f.scrollLeft += (r.left-fr.left) - 24; } }catch(e){} }
}
function visible(){
  return PROJECTS.map(function(p,i){return {p:p,i:i};}).filter(function(o){ return curCat==='All'||o.p.cat===curCat; });
}
var WC_ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';
var WC_SWAP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.2" cy="12" r="5.6"/><circle cx="14.8" cy="12" r="5.6"/></svg>';
function renderGrid(anim){
  var g=document.getElementById('works-grid');
  function draw(){
    g.innerHTML='';
    var list=visible();
    document.getElementById('arch-count').textContent=list.length+' PROJECT'+(list.length===1?'':'S')+(curCat==='All'?'':' — '+curCat.toUpperCase());
    g.classList.toggle('single',list.length===1);
    list.forEach(function(o,k){
      var pat=k%4, alt=o.p.alt||'', a=document.createElement('article');
      a.className='work-card '+((pat===0||pat===3)?'wide':'std')+(alt?' has-swap':'');
      a.setAttribute('role','button');
      a.setAttribute('tabindex','0');
      a.setAttribute('aria-label',o.p.t+' — open project');
      a.innerHTML='<img loading="lazy" alt="">'+
        (alt?'<span class="wc-swap" aria-hidden="true"><img class="wc-alt" loading="lazy" alt=""></span><span class="wc-swapring" aria-hidden="true"></span>':'')+
        '<span class="wc-grad"></span>'+
        '<span class="wc-top"><i class="wc-index">'+pad2(o.i+1)+'</i><i class="wc-cat"></i></span>'+
        '<span class="wc-name"><span class="wc-rule"></span><span class="wc-row"><b></b><i class="wc-arrow">'+WC_ARROW+'</i></span></span>'+
        (alt?'<button class="wc-swapbtn" type="button" aria-pressed="false" aria-label="Show alternate design"><i class="wc-swapbtn-i">'+WC_SWAP+'</i><span class="wc-swapbtn-t">AFTER</span></button>':'');
      var img=a.querySelector('img'); img.src=o.p.img; img.alt=o.p.t;
      img.onerror=function(){this.onerror=null;this.src='https://picsum.photos/seed/arch'+o.i+'/1280/800';};
      a.querySelector('b').textContent=o.p.t;
      a.querySelector('.wc-cat').textContent=String(o.p.cat||'').toUpperCase();
      if(alt){
        var altImg=a.querySelector('.wc-alt');
        altImg.src=alt; altImg.alt=(o.p.t||'')+' — alternate';
        altImg.onerror=function(){ this.style.display='none'; };
        var btn=a.querySelector('.wc-swapbtn');
        btn.onclick=function(e){
          e.preventDefault(); e.stopPropagation();
          var on=a.classList.toggle('show-alt');
          btn.setAttribute('aria-pressed',on?'true':'false');
          btn.setAttribute('aria-label',on?'Show original design':'Show alternate design');
          btn.querySelector('.wc-swapbtn-t').textContent=on?'BEFORE':'AFTER';
          a.classList.remove('is-lens');
        };
        a.addEventListener('pointermove',function(e){
          if(e.pointerType!=='mouse'||a.classList.contains('show-alt')) return;
          var r=a.getBoundingClientRect();
          a.style.setProperty('--lr',Math.max(110,Math.min(220,Math.min(r.width,r.height)*0.34))+'px');
          a.style.setProperty('--mx',(e.clientX-r.left)+'px');
          a.style.setProperty('--my',(e.clientY-r.top)+'px');
          a.classList.add('is-lens');
        });
        a.addEventListener('pointerleave',function(){ a.classList.remove('is-lens'); });
      }
      a.onclick=function(){ clearReveal(); openBehance(o.i); };
      a.onkeydown=function(e){ if(e.target!==a) return; if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openBehance(o.i); } };
      g.appendChild(a);
    });
    g.classList.remove('fade');
  }
  if(anim){ g.classList.add('fade'); setTimeout(draw,220); } else draw();
}
/* touch: first tap reveals caption, second tap opens the project */
var __revealed=null;
function clearReveal(){ if(__revealed){ __revealed.classList.remove('is-reveal'); __revealed=null; } }
(function initTouchReveal(){
  try{
    var mq=window.matchMedia?matchMedia('(hover:none)'):null;
    function touchLike(){ return !!(mq&&mq.matches); }
    document.addEventListener('click',function(e){
      if(!touchLike()) return;
      if(e.target&&e.target.closest&&e.target.closest('.wc-swapbtn')) return;
      var card=e.target&&e.target.closest?e.target.closest('.work-card'):null;
      if(!card){ clearReveal(); return; }
      if(card.classList.contains('is-reveal')){ clearReveal(); return; }
      e.preventDefault(); e.stopPropagation();
      clearReveal();
      card.classList.add('is-reveal');
      __revealed=card;
    },true);
    window.addEventListener('scroll',clearReveal,{passive:true});
  }catch(e){}
})();
var __bIndex=0;
function getGallery(p){ return (p.gallery&&p.gallery.length)?p.gallery:[p.img]; }
function openBehance(i,mode){
  __bIndex=(i+PROJECTS.length)%PROJECTS.length;
  renderBehance();
  var v=document.getElementById('behance-view');
  v.classList.add('open'); v.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden'; v.scrollTop=0;
  var p=PROJECTS[__bIndex];
  paintPath();
  if(mode!=='none'&&p) setPath(urlFor(null,p),mode==='replace'?'replace':'push');
}
function renderBehance(){
  var p=PROJECTS[__bIndex]; if(!p) return;
  document.getElementById('b-title').textContent=p.t;
  document.getElementById('b-desc').textContent=p.d;
  document.getElementById('b-kicker').textContent=p.client.toUpperCase()+' • '+p.year;
  var meta=document.getElementById('b-meta'); meta.innerHTML='';
  [p.client,p.year,p.role,p.cat].concat(p.services||[]).filter(Boolean).forEach(function(s){
    var sEl=document.createElement('span'); sEl.textContent=s; meta.appendChild(sEl);
  });
  (p.links||[]).forEach(function(L){
    if(!L||!L.url) return;
    var aEl=document.createElement('a'); aEl.href=L.url; aEl.target='_blank'; aEl.rel='noopener';
    aEl.textContent='↗ '+(L.label||'Link'); meta.appendChild(aEl);
  });
  (p.keywords||[]).forEach(function(k){
    if(!k) return;
    var kEl=document.createElement('span'); kEl.textContent='#'+String(k).toLowerCase();
    kEl.style.cssText='border-style:dashed;opacity:.85';
    meta.appendChild(kEl);
  });
  var hero=document.getElementById('b-hero');
  hero.src=p.img; hero.alt=p.t+' — cover';
  hero.onerror=function(){this.onerror=null;this.src='https://picsum.photos/seed/'+__bIndex+'arch/1920/1080';};
  var g=document.getElementById('b-gallery'); g.innerHTML='';
  getGallery(p).forEach(function(src,k){
    if(k===0 && src===p.img) return;
    var fig=document.createElement('figure'); fig.className='behance-item';
    var im=document.createElement('img'); im.loading='lazy'; im.src=src; im.alt=p.t+' — shot '+(k+1);
    im.onerror=function(){this.onerror=null;this.src='https://picsum.photos/seed/arch'+__bIndex+'x'+k+'/1920/1080';};
    fig.appendChild(im); g.appendChild(fig);
  });
  var pv=PROJECTS[(__bIndex-1+PROJECTS.length)%PROJECTS.length];
  var nx=PROJECTS[(__bIndex+1)%PROJECTS.length];
  document.getElementById('b-prev-t').textContent='← '+pv.t;
  document.getElementById('b-next-t').textContent=nx.t+' →';
  document.getElementById('b-prev-img').src=pv.img;
  document.getElementById('b-next-img').src=nx.img;
}
function stepBehance(d){ openBehance(__bIndex+d); }
function closeBehance(mode){
  var v=document.getElementById('behance-view');
  if(!v||!v.classList.contains('open')) return;
  v.classList.remove('open'); v.setAttribute('aria-hidden','true'); document.body.style.overflow='';
  paintPath();
  if(mode==='none') return;
  if(history.state&&history.state.pf) history.back();
  else setPath(urlFor(curCat),'replace');
}
window.openBehance=openBehance; window.closeBehance=closeBehance; window.stepBehance=stepBehance;
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeBehance();
  if(!document.getElementById('behance-view').classList.contains('open')) return;
  if(e.key==='ArrowRight') stepBehance(1);
  if(e.key==='ArrowLeft') stepBehance(-1);
});
load().then(function(){ syncFromUrl(true); },function(){ syncFromUrl(true); });
})();
</script>
<script>
if (location.search.indexOf('studio=1') > -1) {
  var __es = document.createElement('script');
  __es.src = '/studio-bridge.js?v=' + Date.now();
  document.body.appendChild(__es);
}
</script>
